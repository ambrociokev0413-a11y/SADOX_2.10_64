name: Build SDX ARM64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        run: |
          mkdir -p source
          unzip -q SDX_ARM64_Stage1_GitHub_Actions_Ready.zip -d source
          ls source

      - name: Build ARM64 library
        run: |
          ROOT="source/SDX_ARM64_Stage1_Native_Reconstruction"
          chmod +x "$ROOT/tools/"*.sh
          "$ROOT/tools/build_arm64.sh"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDX-ARM64-Stage1
          path: source/SDX_ARM64_Stage1_Native_Reconstruction/out/libs/arm64-v8a/libSDX_ARM64_STAGE1.so
          if-no-files-found: error
