on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager 'ndk;27.2.12479018'

      - name: Extract and build
        run: |
          mkdir -p source
          unzip -q SDX_ARM64_Stage1_GitHub_Actions_Ready.zip -d source
          ROOT="source/SDX_ARM64_Stage1_Native_Reconstruction"
          chmod +x "$ROOT/tools/"*.sh
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          "$ROOT/tools/build_arm64.sh"

      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDX-ARM64-Stage1
          path: source/SDX_ARM64_Stage1_Native_Reconstruction/out/libs/arm64-v8a/libSDX_ARM64_STAGE1.so
          if-no-files-found: error
