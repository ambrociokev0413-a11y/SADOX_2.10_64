name: Build SDX ARM64 Stage 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Do not use android-actions/setup-android here: the previous run showed
      # that action trying to resolve the removed SDK package named "tools".
      - name: Install Android NDK without legacy tools package
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" || ! -d "$ANDROID_HOME" ]]; then
            echo "ANDROID_HOME is not available on this runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print | sort -V | tail -n 1)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Extract Stage 2 source ZIP
        run: |
          mkdir -p source
          unzip -q SDX_ARM64_Stage2_GitHub_Actions_Ready.zip -d source
          test -f source/SDX_ARM64_Stage2_Native_Reconstruction/jni/Android.mk

      - name: Build and verify ARM64 library
        run: |
          ROOT="source/SDX_ARM64_Stage2_Native_Reconstruction"
          chmod +x "$ROOT/tools/"*.sh
          "$ROOT/tools/build_arm64.sh"

      - name: Upload Stage 2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDX-ARM64-Stage2
          path: source/SDX_ARM64_Stage2_Native_Reconstruction/out/libs/arm64-v8a/libSDX_ARM64_STAGE2.so
          if-no-files-found: error
